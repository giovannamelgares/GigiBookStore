<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Livros Recomendados</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  </head>

  <body>
    <header>
      <a th:href="@{/}">
        <h1>Gigi's BookStore</h1>
      </a>
      <nav>
        <a th:href="@{/}"> Início </a>
        <a th:href="@{/livros}"> Recomendações </a>
        <div sec:authorize="isAuthenticated()">
          <a th:href="@{/favoritos}"> Favoritos </a>
        </div>
        <div sec:authorize="isAnonymous()">
          <a th:href="@{/login}"> Login </a>
          <a th:href="@{/cadastro-usuario}"> Criar Conta </a>
        </div>
        <div sec:authorize="hasRole('admin')">
          <a th:href="@{/cadastro}"> Cadastrar Livro </a>
        </div>
        <div sec:authorize="isAuthenticated()">
          <a th:href="@{/logout}"> Logout </a>
        </div>
      </nav>
    </header>

    <main class="livros">
      <h2>Livros Recomendados</h2>

      <div class="container-livros">
        <div th:each="livro : ${livros}">
          <a th:href="@{/livro/{id}(id=${livro.id})}" class="card-livro">
            <img th:src="${livro.imagem}" />

            <h3 th:text="${livro.titulo}"></h3>

            <p>
              <span th:text="${livro.autor}"></span>
            </p>
          </a>

          <div class="acoes">
            <div sec:authorize="isAuthenticated()">
              <a
                class="favorito-btn"
                th:href="@{/favoritar/{id}(id=${livro.id})}"
              >
                <i class="bi bi-heart-fill"></i>
              </a>  
            </div>

            <div sec:authorize="hasRole('admin')">
              <a th:href="@{/livro/{id}/editar(id=${livro.id})}"> Editar </a>

              <form
                th:action="@{'/livro/' + ${livro.id} + '/deletar'}"
                method="post"
              >
                <input type="submit" value="Deletar" />
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <p>© 2026 Gigi's BookStore | Um espaço para recomendações de livros :)</p>
    </footer>
  </body>
</html>
