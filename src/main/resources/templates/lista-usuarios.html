<!doctype html>
<html
  lang="pt-br"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usuários Cadastrados</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>

  <body>
    <header>
      <a th:href="@{/}">
        <h1>Gigi's BookStore</h1>
      </a>
      <nav>
        <a th:href="@{/}"> Início </a>
        <a th:href="@{/livros}"> Recomendações </a>
        <div sec:authorize="isAuthenticated()">
          <a th:href="@{/favoritos}"> Favoritos </a>
        </div>
        <div sec:authorize="isAnonymous()">
          <a th:href="@{/login}"> Login </a>
          <a th:href="@{/cadastro-usuario}"> Criar Conta </a>
        </div>
        <div sec:authorize="hasRole('admin')">
          <a th:href="@{/cadastro}"> Cadastrar Livro </a>
          <a th:href="@{/usuarios}"> Usuários </a>
        </div>
        <div sec:authorize="isAuthenticated()">
          <a th:href="@{/logout}"> Logout </a>
        </div>
      </nav>
    </header>

    <main class="livros">
      <h2>Usuários Cadastrados</h2>

      <div class="tabela-usuarios">
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>Email</th>
              <th>Tipo</th>
              <th>Favoritos</th>
            </tr>
          </thead>

          <tbody>
            <tr th:each="usuario : ${usuarios}">
              <td th:text="${usuario.nome}"></td>
              <td th:text="${usuario.email}"></td>
              <td th:text="${usuario.cargo}"></td>
              <td th:text="${usuario.totalFavoritos}"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
    <footer>
      <p>© 2026 Gigi's BookStore | Um espaço para recomendações de livros :)</p>
    </footer>
  </body>
</html>
